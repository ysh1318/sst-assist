<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SST Assist – Trimester Pass</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d111c;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 28px;
    }
    .card {
      background: #141928;
      border: 1px solid #1e2840;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .price {
      font-size: 2.5rem;
      font-weight: 800;
      color: #f1f5f9;
      margin: 8px 0 4px;
    }
    .price span { font-size: 1.1rem; color: #94a3b8; }
    .desc { font-size: 0.8rem; color: #64748b; margin-bottom: 24px; }
    .email-display {
      background: #0d111c;
      border: 1px solid #1e2840;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 20px;
      word-break: break-all;
    }
    .email-display strong { color: #38bdf8; display: block; margin-bottom: 2px; }
    .pay-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1, #8b5cf6);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      letter-spacing: 0.02em;
    }
    .pay-btn:hover { opacity: 0.9; }
    .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg {
      margin-top: 14px;
      font-size: 0.82rem;
      min-height: 20px;
      color: #94a3b8;
    }
    .status-msg.success { color: #10b981; font-weight: 600; }
    .status-msg.error { color: #ef4444; }
    .upi-note {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="logo">⚡ SST Assist</div>
  <div class="subtitle">Trimester Pass – Instant Unlimited Access</div>

  <div class="card">
    <div class="price">₹149 <span>/ trimester</span></div>
    <div class="desc">~₹1.6/day • Unlimited AI Tutoring 24/7</div>

    <div class="email-display">
      <strong>Activating for:</strong>
      <span id="emailDisplay">Loading...</span>
    </div>

    <button id="payBtn" class="pay-btn">⚡ Pay with UPI / Card</button>
    <div id="statusMsg" class="status-msg"></div>
    <div class="upi-note">GPay • PhonePe • Paytm • Credit/Debit Card</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const email = params.get("email") || "";
    const orderId = params.get("orderId") || "";
    const keyId = params.get("keyId") || "";
    const amount = parseInt(params.get("amount") || "14900", 10);
    const gatewayUrl = params.get("gateway") || "https://sst-assist-backend.yashawachar101.workers.dev";

    const emailDisplay = document.getElementById("emailDisplay");
    const payBtn = document.getElementById("payBtn");
    const statusMsg = document.getElementById("statusMsg");

    emailDisplay.textContent = email || "Unknown";

    if (!email || !orderId || !keyId) {
      statusMsg.textContent = "Error: Missing payment details. Please close and try again.";
      statusMsg.className = "status-msg error";
      payBtn.disabled = true;
    }

    payBtn.addEventListener("click", () => {
      payBtn.disabled = true;
      payBtn.textContent = "Opening checkout...";

      const rzp = new Razorpay({
        key: keyId,
        amount: amount,
        currency: "INR",
        order_id: orderId,
        name: "SST Assist",
        description: "Trimester Pass – Unlimited AI Tutoring",
        image: "https://raw.githubusercontent.com/ysh1318/sst-assist/main/icons/icon128.png",
        prefill: {
          email: email,
          contact: ""
        },
        notes: {
          email: email,
          product: "SST Assist Trimester Pass"
        },
        theme: { color: "#6366f1" },
        modal: {
          ondismiss: () => {
            payBtn.disabled = false;
            payBtn.textContent = "⚡ Pay with UPI / Card";
            statusMsg.textContent = "Payment cancelled. Try again when ready.";
            statusMsg.className = "status-msg";
          }
        },
        handler: async (response) => {
          statusMsg.textContent = "Payment received! Activating your Trimester Pass...";
          statusMsg.className = "status-msg";

          try {
            const verifyRes = await fetch(`${gatewayUrl}/api/verify-payment`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                orderId: response.razorpay_order_id,
                paymentId: response.razorpay_payment_id,
                signature: response.razorpay_signature,
                email: email
              })
            });

            const data = await verifyRes.json();

            if (data.success) {
              statusMsg.textContent = "🎉 Trimester Pass Activated! Returning to SST Assist...";
              statusMsg.className = "status-msg success";
              payBtn.textContent = "✓ Activated!";

              // Notify the sidepanel/extension
              try {
                chrome.runtime.sendMessage({
                  action: "PAYMENT_SUCCESS",
                  email: email,
                  paymentId: response.razorpay_payment_id
                });
              } catch (_) {}

              // Auto-close after 2s
              setTimeout(() => window.close(), 2000);
            } else {
              throw new Error(data.error || "Verification failed");
            }
          } catch (err) {
            statusMsg.textContent = `Activation error: ${err.message}. Contact support with Payment ID: ${response.razorpay_payment_id}`;
            statusMsg.className = "status-msg error";
            payBtn.disabled = false;
            payBtn.textContent = "⚡ Pay with UPI / Card";
          }
        }
      });

      rzp.open();
    });
  </script>
</body>
</html>
